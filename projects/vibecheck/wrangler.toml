name = "vibecheck"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# No D1/R2 for the MVP — stateless request/response scanner, nothing to persist yet.

[vars]
ENVIRONMENT = "development"
# Optional: set GITHUB_TOKEN via `wrangler secret put GITHUB_TOKEN` to raise the
# GitHub API rate limit from 60 req/hr (unauthenticated) to 5,000 req/hr.
# The MVP runs fine without it — see src/github.ts for how it's used if present.

[env.staging]
name = "vibecheck-staging"
[env.staging.vars]
ENVIRONMENT = "staging"

[env.production]
name = "vibecheck"
[env.production.vars]
ENVIRONMENT = "production"
