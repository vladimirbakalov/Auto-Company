name = "vibecheck"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# The free scanner stays stateless (no D1 reads/writes on /api/scan). D1 is
# added below solely for the paid monitoring tier — users, monitors, checks,
# alerts — per docs/cto/vibecheck-monitoring-tier-adr.md §1/§6. The waitlist
# KV namespace is unrelated and stays exactly as it was: a single write-mostly
# email list doesn't need a relational database or migrations.

# Monitoring-tier D1 database (users/magic_links/monitors/checks/alerts —
# see migrations/0001_init.sql). Real id below, created and migrated Cycle
# #102 via `wrangler d1 create/migrations apply --temporary` — pending human
# claim within the 60-minute window (see HUMAN_ACTIONS.md #3). Runtime
# null-check in code (`if (!c.env.DB)`) so local dev never breaks on a
# missing binding.
[[d1_databases]]
binding = "DB"
database_name = "vibecheck-db"
database_id = "0552a496-3ab3-4a61-b72f-e749df5f85f8"

# Two Cron Triggers, both feeding the same `scheduled` handler in
# src/index.ts — Cloudflare Workers dispatches every entry in this array to
# that one export, and the handler branches on `event.cron` to tell them
# apart (see MONITOR_CHECK_CRON / RECONCILIATION_CRON in src/index.ts).
#
# 1. "* * * * *" (every minute): polls D1 for monitors due for a check
#    (next_check_at <= now, paused = 0, active subscription) and fans out
#    probes. 1-minute tick per ADR §2 — cost scales with ticks, not
#    monitors, up to the per-tick LIMIT. No-ops gracefully if c.env.DB is
#    missing (same graceful-degradation style as WAITLIST).
#
# 2. "0 * * * *" (top of every hour): the Stripe/D1 reconciliation safety
#    net (critic-munger pre-mortem: "reconciliation-cron webhook safety
#    net" — docs/critic/vibecheck-monitoring-tier-premortem.md). Lists
#    Stripe's own current active-or-trialing subscriptions (no creation-time
#    filter — see fetchStripeSubscriptionCustomerIds in src/stripe.ts for why
#    that would silently miss delayed status transitions) and flags any
#    customer id with no matching D1 `users` row — the signature of a
#    webhook that silently failed. Hourly is plenty for a safety net (this is
#    not the primary provisioning path, POST /api/stripe/webhook is). No-ops
#    gracefully if c.env.STRIPE_SECRET_KEY or
#    c.env.DB is missing.
# Cycle #102: cron triggers failed to attach under the `--temporary` claim
# account (Workers Free plan caps cron triggers at 0 per account, error code
# 10072) — everything else in this file deployed fine. Re-run `wrangler
# deploy` (no `--temporary` needed) after claiming + upgrading to Workers
# Paid to pick these up; the Worker itself is already live without them.
[triggers]
crons = ["* * * * *", "0 * * * *"]

# Waitlist KV store for the "cost + uptime monitoring, coming soon" email
# capture on the scan-results page (CEO mandate: see
# docs/ceo/vibecheck-godecision-cycle4.md). KV is the simplest primitive that
# fits: write-mostly key -> value, no queries, no joins.
#
# Real ids below, created Cycle #102 via `wrangler kv:namespace create
# WAITLIST --temporary` against a `wrangler deploy --temporary` claim
# account — pending human claim within the 60-minute window (see
# HUMAN_ACTIONS.md #3). src/index.ts checks `c.env.WAITLIST` at runtime and
# no-ops with a logged TODO if the binding is ever missing, so this can never
# turn into a 500 for the user.
[[kv_namespaces]]
binding = "WAITLIST"
id = "c613fd54d981469faee9fa77cea3cf2a"
preview_id = "577843e382f04bef8b295ce0bbb3f46e"

# Coarse per-IP rate-limit counters for the unauthenticated URL-probing/
# scanning endpoints (POST /api/scan, POST /api/probe-check, POST
# /api/monitors — see src/rateLimit.ts). Closes the KNOWN GAP flagged above
# POST /api/probe-check in src/index.ts (QA cycle #1146): none of those
# routes were throttled, so a single IP could fire unlimited server-side
# fetches. A dedicated namespace rather than reusing WAITLIST above — a
# mailing list and abuse counters are unrelated data with very different
# write patterns (rare/durable vs. frequent/throwaway, short TTL). Fixed-
# window counters, not a queryable store, so KV (no migrations, no schema)
# is still the right primitive.
#
# Real ids below, created Cycle #102 the same way as WAITLIST above —
# pending human claim within the 60-minute window (see HUMAN_ACTIONS.md #3).
# checkRateLimit() (src/rateLimit.ts) treats a missing binding as "always
# allow" rather than throwing, so this can never turn into a 500 or an
# availability regression for real traffic.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "49f14d743ab24a05b808799b45845b3c"
preview_id = "c489e8aee30f455abf2d584e46cf4e7c"

[vars]
ENVIRONMENT = "development"
# Optional: set GITHUB_TOKEN via `wrangler secret put GITHUB_TOKEN` to raise the
# GitHub API rate limit from 60 req/hr (unauthenticated) to 5,000 req/hr.
# The MVP runs fine without it — see src/github.ts for how it's used if present.

[env.staging]
name = "vibecheck-staging"
[env.staging.vars]
ENVIRONMENT = "staging"

[env.production]
name = "vibecheck"
[env.production.vars]
ENVIRONMENT = "production"

# TODO(devops): the magic-link email (src/index.ts, POST /api/stripe/webhook)
# builds its link from `new URL('/api/auth/verify', c.req.url)` — i.e.
# whatever origin Stripe's dashboard has configured as this environment's
# webhook endpoint, not a hardcoded domain. That's correct only if the
# configured webhook URL is the same public/branded domain real users hit.
# Before relying on magic-link emails looking right, confirm in the Stripe
# dashboard that each environment's webhook endpoint points at its real
# custom domain, not a raw *.workers.dev URL — otherwise emails still work
# (same Worker, same D1) but link out to an unbranded/internal-looking host.
